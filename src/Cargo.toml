[package]
name = "ohvpack"
version = "0.8.1"
description = "Poulpy implementation of OHVPack and VPack"
edition = "2024"

[features]
# Enables AVX2.
avx = ["dep:poulpy-cpu-avx"]
# Enables AVX512.
avx512 = ["dep:poulpy-cpu-avx512"]
# The three profiling modes. Each swaps the benchmarks from wall-clock sampling to one
# instrumented run (see `bench_timing::run_modes`); they are mutually exclusive.
# Per-section peak heap, via an instrumenting global allocator.
mem-profile = []
# Per-operation timing breakdown.
time-profile = []
# Per-layer output noise variance.
noise-profile = []

[dependencies]
poulpy-hal      = "=0.8.1"
poulpy-core     = "=0.8.1"
# 0.8.0 is the latest published version of this one; the rest of poulpy is at 0.8.1.
poulpy-bin-fhe  = "=0.8.0"
poulpy-cpu-ref = {version = "=0.8.1", features=["enable-core"]}
serde_json = "1.0.150"
rand = "0.10.2"

[target.'cfg(target_arch = "x86_64")'.dependencies]
poulpy-cpu-avx    = { version = "=0.8.1", optional = true, features = ["enable-avx"] }
poulpy-cpu-avx512 = { version = "=0.8.1", optional = true, features = ["enable-avx512f", "enable-ifma"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
poulpy-cpu-arm = { version = "=0.8.1", optional = true, features = ["enable-neon"] }

[[test]]
name = "selector"
path = "tests/test_selector.rs"

[[test]]
name = "vpack"
path = "tests/test_vpack.rs"

[[test]]
name = "ohvpack"
path = "tests/test_ohvpack.rs"

[[bench]]
name = "vpack"
path = "benchmarks/bench_vpack.rs"
harness = false

[[bench]]
name = "ohvpack"
path = "benchmarks/bench_ohvpack.rs"
harness = false
